[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "helf"
version = "0.3.0"
description = "Review-stage implementation of HeLF: heterogeneous latent fusion of physical mechanisms and data features for transonic airfoil flow reconstruction"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "HeLF authors"}]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.23",
  "PyYAML>=6.0",
  "torch>=2.0",
  "torchvision>=0.15",
  "tqdm>=4.65",
]

[project.urls]
Repository = "https://github.com/YingqiWang-HIT/HeLF"
Documentation = "https://github.com/YingqiWang-HIT/HeLF/tree/main/docs"

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "ruff>=0.4",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"
