# Provenance record for every compared method.
# Fill every TO_FILL entry before reporting results. Do not copy numbers between
# methods; parameter counts, NFE, and timings must be measured for each method.

protocol:
  split: geometry-disjoint, identical for all methods
  normalization: training split only
  evaluation: scripts/evaluate_predictions.py --shock-region reference
  timing: TO_FILL  # warm-up runs, timed runs, synchronization, hardware

baselines:
  - name: ARASF
    category: deterministic
    reference: "Liu et al., Nat. Mach. Intell. 7 (2025) 1129-1140"
    source: TO_FILL
    commit: TO_FILL
    license: TO_FILL
    adaptation: TO_FILL
    params_m: TO_FILL
    nfe: 1

  - name: GrFormer
    category: deterministic
    replaces: TransCFD
    reference: "Kang et al., Inf. Fusion 125 (2026) 103402"
    source: https://github.com/Shaoyun2023/GrFormer
    commit: TO_FILL
    license: TO_FILL
    adaptation: TO_FILL  # input channels, output head, loss (see baselines/README.md)
    params_m: TO_FILL
    nfe: 1

  - name: Flow3DNet
    category: deterministic
    reference: "Zuo et al., Aerosp. Sci. Technol. 159 (2025) 109991"
    source: TO_FILL
